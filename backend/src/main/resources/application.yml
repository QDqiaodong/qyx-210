server:
  port: ${SERVER_PORT:8140}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3356}/${DB_NAME:seat_stats}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6429}
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

logging:
  level:
    com.example.seatstats: DEBUG
    org.hibernate.SQL: DEBUG
